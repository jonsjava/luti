[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "luti-tui"
version = "1.0.0"
description = "A terminal client for Lemmy (0.19 and 1.0), built with Textual"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "luti contributors" }]
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "platformdirs>=4",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
luti-tui = "luti_tui.app:main"

[project.urls]
Homepage = "https://github.com/jonsjava/luti"

[tool.hatch.build.targets.wheel]
packages = ["luti_tui"]

[tool.hatch.build.targets.sdist]
include = ["luti_tui", "tests", "hatch_build.py", "README.md"]

# Bundles ../spec/endpoints.json into the package (see hatch_build.py).
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the dev Lemmy servers from dev/docker-compose.yml"]
testpaths = ["tests"]
