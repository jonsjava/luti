[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "luti"
dynamic = ["version"]
description = "Lemmy client library (API v3 and v4) and terminal app"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "luti contributors" }]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
tui = ["textual>=0.86", "textual-image>=0.8", "pillow>=10"]
keyring = ["keyring>=24"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]
all = ["luti[tui,keyring]"]

[project.scripts]
luti-tui = "luti.tui:main"

[project.urls]
Homepage = "https://github.com/jonsjava/luti"

[tool.hatch.version]
path = "luti/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["luti"]

[tool.hatch.build.targets.sdist]
include = ["luti", "tests", "hatch_build.py", "README.md"]

# Bundles ../spec/endpoints.json into the package (see hatch_build.py).
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the dev Lemmy servers from dev/docker-compose.yml",
    "install: builds fresh venvs and pip-installs the package (slow, needs the package index)",
    "real_clipboard: runs the real clipboard code (the test must stub subprocess itself)",
]
testpaths = ["tests"]
