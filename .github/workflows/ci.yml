name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    name: Bash (shellcheck + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          mkdir -p tests/bash/.tools && cd tests/bash/.tools
          npm i --silent bats
          python3 -m venv venv && venv/bin/pip install -q shellcheck-py
      - name: shellcheck
        run: make -C bash check
      - name: Unit tests
        run: tests/bash/.tools/node_modules/.bin/bats tests/bash/unit_*.bats

  python:
    name: Python ${{ matrix.python }} (unit tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        working-directory: python
        run: pip install -e '.[tui,test]'
      - name: Unit tests
        working-directory: python
        run: pytest -m "not integration"

  integration:
    name: Integration (Lemmy 0.19 + 1.0)
    runs-on: ubuntu-latest
    needs: [bash, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start dev Lemmy servers
        run: |
          docker compose -f dev/docker-compose.yml up -d
          for i in $(seq 1 60); do
            curl -sf localhost:8536/api/v3/site >/dev/null && curl -sf localhost:8537/api/v4/site >/dev/null && break
            sleep 3
          done
          curl -sf localhost:8536/api/v3/site >/dev/null && curl -sf localhost:8537/api/v4/site >/dev/null
      - name: Seed and check the endpoint map
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          dev/seed.sh
          dev/check-spec.sh
      - name: Install test tools
        run: |
          mkdir -p tests/bash/.tools && cd tests/bash/.tools
          npm i --silent bats
          cd ../../../python && pip install -e '.[tui,test]'
      - name: Bash integration tests
        run: tests/bash/.tools/node_modules/.bin/bats tests/bash/integration_v3.bats tests/bash/integration_v4.bats
      - name: Python integration tests (must not skip)
        working-directory: python
        run: |
          pytest -m integration -rs | tee ../pytest-integration.log
          ! grep -q SKIPPED ../pytest-integration.log
      - name: Server logs on failure
        if: failure()
        run: docker compose -f dev/docker-compose.yml logs --tail 200 lemmy019 lemmy10
